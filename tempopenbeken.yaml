substitutions:
  name: "tuya-temp-hum"
  friendly_name: "Tuya Temp & Humidity"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

bk72xx:
  board: cbu

api:

ota:
  - platform: esphome

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  use_address: 192.168.20.20
  manual_ip:
    static_ip: 192.168.20.20
    gateway: 192.168.20.1
    subnet: 255.255.255.0

captive_portal:

# Use explicit custom/bitbang software I2C component override
i2c:
  id: bus_a
  sda: GPIO22
  scl: GPIO20
  scan: true

sensor:
  - platform: sht3xd
    i2c_id: bus_a
    address: 0x44
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    update_interval: 30s

  - platform: adc
    pin: P23
    name: "Battery Voltage"
    update_interval: 60s
    filters:
      - multiply: 2.0

binary_sensor:
  - platform: gpio
    pin:
      number: P14
      mode: INPUT
      inverted: true
    name: "Pairing Button"

status_led:
  pin:
    number: P8
    inverted: true
